[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stageproof"
version = "0.1.0"
description = "StageProof - AI-Powered Cyber-Physical Integrity for Flood Early Warning Systems (hackathon prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "plotly>=5.20",
]

[project.optional-dependencies]
data = [
    "requests>=2.31",
    "dataretrieval>=1.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["stageproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
